<!DOCTYPE html>
<html lang="en" data-theme="tokyo-night">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio — software engineer &amp; open-source contributor.">

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ── Nav ──────────────────────────────────────────────── -->
  <header id="site-header">
    <nav class="nav-inner">
      <a href="/" class="nav-brand" id="nav-brand" aria-label="Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" id="brand-name">portfolio</span>
      </a>

      <div class="nav-links" id="nav-links">
        <a href="#credentials" class="nav-link">skills</a>
        <a href="#projects" class="nav-link">projects</a>
      </div>

      <div class="nav-actions">
        <!-- Theme dropdown -->
        <div class="theme-picker" id="theme-picker">
          <button class="theme-btn" id="theme-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Change color theme">
            <span id="theme-label">tokyo night</span>
            <svg class="theme-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <ul class="theme-dropdown" id="theme-dropdown" role="listbox" aria-label="Color themes">
            <li class="theme-option" role="option" data-theme-id="tokyo-night">tokyo night</li>
            <li class="theme-option" role="option" data-theme-id="catppuccin-latte">catppuccin latte</li>
            <li class="theme-option" role="option" data-theme-id="gruvbox">gruvbox</li>
            <li class="theme-option" role="option" data-theme-id="rose-pine">rosé pine</li>
            <li class="theme-option" role="option" data-theme-id="nord">nord</li>
            <li class="theme-option" role="option" data-theme-id="everforest">everforest</li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- ── Main ─────────────────────────────────────────────── -->
  <main id="main">

    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="hero-inner">
        <div class="hero-avatar" id="hero-avatar" aria-hidden="true"></div>
        <div class="hero-text">
          <h1 class="hero-name" id="hero-name"></h1>
          <p class="hero-title" id="hero-title"></p>
          <p class="hero-bio" id="hero-bio"></p>
          <div class="hero-meta" id="hero-meta">
            <span class="hero-location" id="hero-location"></span>
          </div>
          <div class="hero-links" id="hero-links" role="list" aria-label="Social links"></div>
        </div>
      </div>
    </section>

    <!-- Skills / Credentials -->
    <section class="section section-alt" id="credentials" aria-labelledby="credentials-heading">
      <div class="section-inner">
        <h2 class="section-title" id="credentials-heading">
          <span class="section-prefix" aria-hidden="true">~/</span>skills
        </h2>
        <div class="credentials-grid" id="credentials-grid"></div>
      </div>
    </section>

    <!-- Projects -->
    <section class="section" id="projects" aria-labelledby="projects-heading">
      <div class="section-inner">
        <h2 class="section-title" id="projects-heading">
          <span class="section-prefix" aria-hidden="true">~/</span>projects
        </h2>
        <div class="project-grid" id="project-grid" role="list"></div>
      </div>
    </section>

  </main>

  <!-- ── Footer ────────────────────────────────────────────── -->
  <footer class="site-footer" id="site-footer">
    <div class="footer-inner">
      <span class="footer-copy" id="footer-copy"></span>
      <span class="footer-built">built with ♥ &nbsp;&amp; vanilla JS</span>
    </div>
  </footer>

  <!-- Data + App -->
  <script src="data.js"></script>
  <script src="app.js"></script>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('[SW] registered', r.scope))
          .catch(e => console.warn('[SW] failed', e));
      });
    }
  </script>
</body>

</html>
